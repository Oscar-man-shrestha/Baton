<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>.tile{position:relative;width:100%;height:100%;padding:30px 32px;display:grid;align-content:space-between;overflow:hidden}.tile .mark{width:48px;height:48px;border-radius:14px}.tile .mark i{width:24px;height:7px}h1{font-size:52px}.tile p{margin:0;color:var(--mute);font-size:17px;line-height:1.35}.halo{position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(196,181,255,.25);box-shadow:inset 0 0 0 18px rgba(139,108,255,.05)}.halo.b{right:-90px;top:-90px;width:300px;height:300px;border-color:rgba(255,107,74,.18)}</style></head><body>
<div class="tile"><span class="halo"></span><span class="halo b"></span><span class="mark"><i></i></span><div><h1>Baton <em>Pass</em></h1><p style="margin-top:10px">Continue any AI chat<br>when you hit the limit.</p></div></div></body></html>

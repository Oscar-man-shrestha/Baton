<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handoff</title><style>
body{font:14px system-ui;min-width:360px;max-width:480px;margin:0;padding:16px;color:#17212b;background:#f8fafc}h1{font-size:20px;margin:0 0 10px}button,select,textarea,input{font:inherit}button{padding:8px 10px;border:1px solid #566; border-radius:7px;background:white;cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2364c8}textarea{box-sizing:border-box;width:100%;height:210px;padding:9px}label{display:block;margin:10px 0 4px}#status{min-height:32px}small{display:block;color:#455;line-height:1.4}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}@media(prefers-contrast:more){body{background:#fff;color:#000}button,textarea{border:2px solid #000}}
</style></head><body><h1>Handoff</h1><p id="status" role="status">Open a supported AI chat, then capture its visible conversation.</p><button id="capture">Capture current chat</button><label for="project">Project name</label><input id="project" placeholder="Optional project name"><button id="save">Save brief to project</button><label for="draft">Review and edit the draft</label><textarea id="draft" aria-label="Handoff draft"></textarea><small id="receipt"></small><label for="destination">Continue in</label><select id="destination"><option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="deepseek">DeepSeek</option><option value="grok">Grok</option><option value="perplexity">Perplexity</option></select><div class="row"><button id="open">Open as draft</button><button id="copy">Copy draft</button></div><div class="row"><button id="settings">Settings and projects</button></div><small>Nothing is sent until you press Send in the destination chat.</small><script type="module" src="./main.ts"></script></body></html>

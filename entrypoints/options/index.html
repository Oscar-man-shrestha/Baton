<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handoff settings</title><style>body{font:16px system-ui;max-width:720px;margin:30px auto;padding:0 20px;color:#17212b}button,input{font:inherit}button{padding:8px;margin:6px;border:1px solid #445;border-radius:6px;background:#fff}button:focus-visible,input:focus-visible{outline:3px solid #2364c8}li{margin:8px 0}small{color:#455}@media(prefers-contrast:more){button{border:2px solid #000}}</style></head><body><h1>Handoff settings</h1><p>Choose which destinations appear. Chat content and project briefs stay in local extension storage.</p><fieldset><legend>Providers</legend><div id="providers"></div></fieldset><h2>Projects</h2><ul id="projects"></ul><button id="export">Export projects as JSON</button><label>Import projects JSON <input id="import" type="file" accept="application/json"></label><h2>Diagnostics</h2><button id="selftest">Check current chat selectors</button><p id="health" role="status"></p><h2>Retention</h2><button id="delete">Delete all local Handoff data</button><p><small>Draft insertion needs a logged-in destination and a compatible editor. No draft is submitted automatically.</small></p><script type="module" src="./main.ts"></script></body></html>

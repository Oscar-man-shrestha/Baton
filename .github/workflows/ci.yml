name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Handoff fidelity benchmark
        run: npm run eval:handoff
      - name: Build the store package
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: baton-pass-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
